name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 builds; keep testing the
          # 3.9 minimum on 24.04.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python run_tests.py
